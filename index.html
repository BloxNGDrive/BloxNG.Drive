<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BloxNG.Drive</title>
    
    <link rel="icon" type="image/png" href="favicon.png">

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            font-family: Arial, Helvetica, sans-serif;

        }


        body {

            min-height: 100vh;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #2459a6 0%,
                    #326bb9 50%,
                    #3975c4 100%
                );

            background-attachment: fixed;

        }


        /* =================================================
           MAIN PAGE
        ================================================= */

        .page {

            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;

        }


        .content {

            width: min(1050px, calc(100% - 40px));

            margin: 0 auto;

            padding-top: 55px;
            padding-bottom: 35px;

            flex: 1;

        }


        /* =================================================
           LOGO / TITLE
        ================================================= */

        .logo {

            display: block;

            width: min(300px, 70%);

            height: auto;

            margin: 0 auto 20px auto;

        }


        h1 {

            margin: 0;

            text-align: center;

            font-size: clamp(26px, 4vw, 40px);

            font-weight: bold;

        }


        h2 {

            margin: 8px 0 40px 0;

            text-align: center;

            font-size: clamp(16px, 2vw, 21px);

            font-weight: normal;

            color: white;

        }


        /* =================================================
           MAIN AREA
        ================================================= */

        .main-area {

            display: flex;

            align-items: flex-start;

            justify-content: center;

            gap: clamp(25px, 6vw, 75px);

        }


        /* =================================================
           LEFT SIDE
        ================================================= */

        .left-side {

            flex: 1;

            max-width: 650px;

        }


        .homepage-image {

            display: block;

            width: 100%;

            aspect-ratio: 16 / 9;

            object-fit: cover;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.28);

        }


        .build-text {

            margin-top: 18px;

            text-align: center;

            font-size: 25px;

            font-weight: bold;

        }


        /* =================================================
           ACCOUNT PANEL
        ================================================= */

        .account-panel {

            width: min(35%, 300px);

            min-width: 245px;

            background:
                rgba(25, 82, 155, 0.72);

            padding: 18px;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.18);

        }


        /* =================================================
           TABS
        ================================================= */

        .tabs {

            display: flex;

            width: 100%;

            margin-bottom: 18px;

            border-bottom:
                1px solid rgba(255,255,255,0.35);

        }


        .tab {

            flex: 1;

            padding: 8px 5px;

            border: none;

            background: transparent;

            color: #8fc2ed;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .tab.active {

            color: white;

            border-bottom:
                2px solid white;

        }


        .tab:hover {

            color: white;

        }


        /* =================================================
           FORMS
        ================================================= */

        .account-form {

            display: none;

        }


        .account-form.active {

            display: block;

        }


        .form-title {

            margin: 0 0 14px 0;

            font-size: 20px;

            font-weight: bold;

        }


        label {

            display: block;

            margin-top: 10px;

            margin-bottom: 4px;

            font-size: 13px;

            font-weight: bold;

        }


        input,
        select {

            width: 100%;

            height: 32px;

            padding: 5px 7px;

            border: 1px solid #a9c6e6;

            border-radius: 0;

            background: white;

            color: #222;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 13px;

            outline: none;

        }


        input:focus,
        select:focus {

            border-color: white;

        }


        /* =================================================
           BIRTHDAY
        ================================================= */

        .birthday-row {

            display: flex;

            gap: 5px;

        }


        .birthday-row select {

            flex: 1;

            min-width: 0;

        }


        .help-text {

            margin-top: 4px;

            color: #c8def5;

            font-size: 11px;

            line-height: 1.3;

        }


        /* =================================================
           GENDER
        ================================================= */

        .gender-row {

            display: flex;

            gap: 15px;

            margin-top: 5px;

        }


        .gender-option {

            display: flex;

            align-items: center;

            gap: 5px;

            margin: 0;

            font-size: 13px;

            font-weight: normal;

        }


        .gender-option input {

            width: auto;

            height: auto;

        }


        /* =================================================
           BUTTONS
        ================================================= */

        .submit-button {

            width: 100%;

            height: 38px;

            margin-top: 18px;

            border: 1px solid #17882e;

            border-radius: 2px;

            background:
                linear-gradient(
                    #55d66b,
                    #28a943
                );

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            text-shadow:
                0 1px 1px rgba(0,0,0,0.25);

        }


        .submit-button:hover {

            background:
                linear-gradient(
                    #65df79,
                    #32b64e
                );

        }


        .submit-button:active {

            transform: translateY(1px);

        }


        .submit-button:disabled {

            opacity: 0.6;

            cursor: wait;

        }


        /* =================================================
           STATUS
        ================================================= */

        .status {

            min-height: 18px;

            margin-top: 10px;

            text-align: center;

            font-size: 12px;

            line-height: 1.35;

        }


        /* =================================================
           FORGOT PASSWORD
        ================================================= */

        .forgot-password {

            display: block;

            margin-top: 12px;

            text-align: center;

            color: #c6e2ff;

            font-size: 12px;

            text-decoration: underline;

            cursor: pointer;

        }


        .forgot-password:hover {

            color: white;

        }


        /* =================================================
           FOOTER
        ================================================= */

        footer {

            width: 100%;

            padding: 18px 20px 25px 20px;

            text-align: center;

            color: #c8def5;

            font-size: 12px;

        }


        footer a {

            color: white;

            text-decoration: none;

            margin: 0 7px;

        }


        footer a:hover {

            text-decoration: underline;

        }


        .copyright {

            margin-top: 9px;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 700px) {

            .content {

                padding-top: 30px;

            }


            .main-area {

                flex-direction: column;

                align-items: center;

            }


            .left-side {

                width: 100%;

                max-width: 650px;

            }


            .account-panel {

                width: 100%;

                max-width: 400px;

                min-width: 0;

            }


            h2 {

                margin-bottom: 28px;

            }

        }


        @media (max-width: 400px) {

            .content {

                width: calc(100% - 24px);

            }


            .birthday-row {

                gap: 3px;

            }


            .birthday-row select {

                font-size: 12px;

            }


            footer a {

                display: inline-block;

                margin: 3px 4px;

            }

        }

    </style>

</head>


<body>


<div class="page">


    <main class="content">


        <!-- =================================================
             LOGO
        ================================================= -->

        <img
            src="logo.png"
            alt="BloxNG.Drive"
            class="logo"
        >


        <!-- =================================================
             TITLE
        ================================================= -->

        <h1>
            Join the BloxNG.Drive community
        </h1>


        <h2>
            and explore what others have created
        </h2>


        <!-- =================================================
             MAIN AREA
        ================================================= -->

        <div class="main-area">


            <!-- =============================================
                 LEFT SIDE
            ============================================== -->

            <div class="left-side">

                <img
                    src="homepage.png"
                    alt="BloxNG.Drive"
                    class="homepage-image"
                >

                <div class="build-text">
                    What will you build?
                </div>

            </div>


            <!-- =============================================
                 ACCOUNT PANEL
            ============================================== -->

            <div class="account-panel">


                <!-- =========================================
                     TABS
                ========================================== -->

                <div class="tabs">

                    <button
                        type="button"
                        id="signupTab"
                        class="tab active"
                    >
                        Sign Up
                    </button>


                    <button
                        type="button"
                        id="loginTab"
                        class="tab"
                    >
                        Login
                    </button>

                </div>


                <!-- =========================================
                     SIGN UP FORM
                ========================================== -->

                <form
                    id="signupForm"
                    class="account-form active"
                >

                    <div class="form-title">
                        Create an account
                    </div>


                    <!-- Birthday -->

                    <label>
                        Birthday
                    </label>


                    <div class="birthday-row">


                        <select id="birthMonth">

                            <option value="">
                                Month
                            </option>

                            <option value="01">January</option>
                            <option value="02">February</option>
                            <option value="03">March</option>
                            <option value="04">April</option>
                            <option value="05">May</option>
                            <option value="06">June</option>
                            <option value="07">July</option>
                            <option value="08">August</option>
                            <option value="09">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>

                        </select>


                        <select id="birthDay">

                            <option value="">
                                Day
                            </option>

                            <option value="01">1</option>
                            <option value="02">2</option>
                            <option value="03">3</option>
                            <option value="04">4</option>
                            <option value="05">5</option>
                            <option value="06">6</option>
                            <option value="07">7</option>
                            <option value="08">8</option>
                            <option value="09">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                            <option value="13">13</option>
                            <option value="14">14</option>
                            <option value="15">15</option>
                            <option value="16">16</option>
                            <option value="17">17</option>
                            <option value="18">18</option>
                            <option value="19">19</option>
                            <option value="20">20</option>
                            <option value="21">21</option>
                            <option value="22">22</option>
                            <option value="23">23</option>
                            <option value="24">24</option>
                            <option value="25">25</option>
                            <option value="26">26</option>
                            <option value="27">27</option>
                            <option value="28">28</option>
                            <option value="29">29</option>
                            <option value="30">30</option>
                            <option value="31">31</option>

                        </select>


                        <select id="birthYear">

                            <option value="">
                                Year
                            </option>

                            <script>

                                const currentYear =
                                    new Date().getFullYear();

                                for (
                                    let year = currentYear;
                                    year >= 1900;
                                    year--
                                ) {

                                    document.write(
                                        `<option value="${year}">${year}</option>`
                                    );

                                }

                            </script>

                        </select>

                    </div>


                    <div class="help-text">
                        Your birthday helps us provide the right experience.
                    </div>


                    <!-- Gender -->

                    <label>
                        Gender
                    </label>


                    <div class="gender-row">


                        <label class="gender-option">

                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                            >

                            Male

                        </label>


                        <label class="gender-option">

                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                            >

                            Female

                        </label>

                    </div>


                    <!-- Username -->

                    <label for="username">
                        Username
                    </label>


                    <input
                        type="text"
                        id="username"
                        maxlength="20"
                        autocomplete="username"
                        required
                    >


                    <!-- Email -->

                    <label for="email">
                        Email
                    </label>


                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        required
                    >


                    <!-- Password -->

                    <label for="password">
                        Password
                    </label>


                    <input
                        type="password"
                        id="password"
                        maxlength="20"
                        autocomplete="new-password"
                        required
                    >


                    <!-- Confirm Password -->

                    <label for="confirmPassword">
                        Confirm Password
                    </label>


                    <input
                        type="password"
                        id="confirmPassword"
                        maxlength="20"
                        autocomplete="new-password"
                        required
                    >


                    <!-- Submit -->

                    <button
                        type="submit"
                        id="signupButton"
                        class="submit-button"
                    >
                        Sign Up
                    </button>


                    <div
                        id="signupStatus"
                        class="status"
                    ></div>

                </form>


                <!-- =========================================
                     LOGIN FORM
                ========================================== -->

                <form
                    id="loginForm"
                    class="account-form"
                >

                    <div class="form-title">
                        Login
                    </div>


                    <!-- Username -->

                    <label for="loginUsername">
                        Username
                    </label>


                    <input
                        type="text"
                        id="loginUsername"
                        autocomplete="username"
                        required
                    >


                    <!-- Password -->

                    <label for="loginPassword">
                        Password
                    </label>


                    <input
                        type="password"
                        id="loginPassword"
                        autocomplete="current-password"
                        required
                    >


                    <!-- Login -->

                    <button
                        type="submit"
                        id="loginButton"
                        class="submit-button"
                    >
                        Login
                    </button>


                    <div
                        id="loginStatus"
                        class="status"
                    ></div>


                    <!-- Forgot password -->

                    <a
                        href="#"
                        id="forgotPassword"
                        class="forgot-password"
                    >
                        Forgot password?
                    </a>

                </form>

            </div>

        </div>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <div>

            <a href="#">
                Home
            </a>

            <a href="#">
                Forums
            </a>

            <a href="#">
                About
            </a>

            <a href="#">
                Privacy
            </a>

            <a href="#">
                Terms
            </a>

            <a href="#">
                Help
            </a>

        </div>


        <div class="copyright">

            © 2026 BloxNG.Drive

        </div>

    </footer>

</div>



<!-- =====================================================
     SUPABASE LIBRARY
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<!-- =====================================================
     ACCOUNT SYSTEM
===================================================== -->

<script>

    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
        "https://iihibiykvlnipncfbfbi.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_t3SpgXK9EwFtQ2Wo1FsgJA_gCrnw1bd";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );



    /* =====================================================
       GET ELEMENTS
    ===================================================== */

    const signupTab =
        document.getElementById("signupTab");


    const loginTab =
        document.getElementById("loginTab");


    const signupForm =
        document.getElementById("signupForm");


    const loginForm =
        document.getElementById("loginForm");


    const signupButton =
        document.getElementById("signupButton");


    const loginButton =
        document.getElementById("loginButton");



    /* =====================================================
       TAB SWITCHING
    ===================================================== */

    signupTab.addEventListener(
        "click",
        function() {

            signupTab.classList.add("active");

            loginTab.classList.remove("active");


            signupForm.classList.add("active");

            loginForm.classList.remove("active");

        }
    );


    loginTab.addEventListener(
        "click",
        function() {

            loginTab.classList.add("active");

            signupTab.classList.remove("active");


            loginForm.classList.add("active");

            signupForm.classList.remove("active");

        }
    );



    /* =====================================================
       SIGN UP
    ===================================================== */

    signupForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const status =
                document.getElementById(
                    "signupStatus"
                );


            status.textContent =
                "Creating account...";


            signupButton.disabled = true;



            /* ---------------------------------------------
               GET VALUES
            --------------------------------------------- */

            const username =
                document.getElementById(
                    "username"
                ).value.trim();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            const confirmPassword =
                document.getElementById(
                    "confirmPassword"
                ).value;


            const month =
                document.getElementById(
                    "birthMonth"
                ).value;


            const day =
                document.getElementById(
                    "birthDay"
                ).value;


            const year =
                document.getElementById(
                    "birthYear"
                ).value;


            const genderElement =
                document.querySelector(
                    'input[name="gender"]:checked'
                );



            /* ---------------------------------------------
               VALIDATE USERNAME
            --------------------------------------------- */

            if (
                !/^[A-Za-z0-9]{3,20}$/.test(
                    username
                )
            ) {

                status.textContent =
                    "Username must be 3–20 letters or numbers.";

                signupButton.disabled = false;

                return;
            }



            /* ---------------------------------------------
               VALIDATE EMAIL
            --------------------------------------------- */

            if (!email) {

                status.textContent =
                    "Please enter your email.";

                signupButton.disabled = false;

                return;
            }



            /* ---------------------------------------------
               VALIDATE PASSWORD
            --------------------------------------------- */

            if (
                password.length < 6 ||
                password.length > 20
            ) {

                status.textContent =
                    "Password must be 6–20 characters.";

                signupButton.disabled = false;

                return;
            }


            if (
                password !==
                confirmPassword
            ) {

                status.textContent =
                    "Passwords do not match.";

                signupButton.disabled = false;

                return;
            }



            /* ---------------------------------------------
               VALIDATE BIRTHDAY
            --------------------------------------------- */

            if (
                !month ||
                !day ||
                !year
            ) {

                status.textContent =
                    "Please enter your birthday.";

                signupButton.disabled = false;

                return;
            }



            /* ---------------------------------------------
               VALIDATE GENDER
            --------------------------------------------- */

            if (!genderElement) {

                status.textContent =
                    "Please select your gender.";

                signupButton.disabled = false;

                return;
            }


            const gender =
                genderElement.value;


            const birthday =
                `${year}-${month}-${day}`;



            /* =================================================
               CHECK USERNAME
            ================================================= */

            const {
                data: existingProfile,
                error: usernameError
            } =
                await supabaseClient
                    .from("profiles")
                    .select("id, username")
                    .eq("username", username)
                    .maybeSingle();


            if (usernameError) {

                console.error(
                    usernameError
                );

                status.textContent =
                    usernameError.message;

                signupButton.disabled = false;

                return;
            }


            if (existingProfile) {

                status.textContent =
                    "That username is already taken.";

                signupButton.disabled = false;

                return;
            }



            /* =================================================
               CREATE AUTH ACCOUNT
            ================================================= */

            /*
               IMPORTANT:

               We do NOT insert into profiles here.

               The handle_new_user database trigger
               automatically creates the profile.

               The information below is stored in
               Supabase Auth metadata and the trigger
               reads it.
            */

            const {
                data: authData,
                error: authError
            } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            username: username,

                            birthday: birthday,

                            gender: gender

                        }

                    }

                });


            if (authError) {

                console.error(
                    authError
                );

                status.textContent =
                    authError.message;

                signupButton.disabled = false;

                return;
            }


            if (!authData.user) {

                status.textContent =
                    "Account could not be created.";

                signupButton.disabled = false;

                return;
            }



            /* =================================================
               SUCCESS
            ================================================= */

            status.textContent =
                "Account created successfully! :D";


            signupForm.reset();


            signupButton.disabled = false;



            /* ---------------------------------------------
               GO TO MAIN PAGE
            --------------------------------------------- */

            setTimeout(
                function() {

                    window.location.href =
                        "main.html";

                },
                700
            );

        }
    );



    /* =====================================================
       LOGIN
    ===================================================== */

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const status =
                document.getElementById(
                    "loginStatus"
                );


            const username =
                document.getElementById(
                    "loginUsername"
                ).value.trim();


            const password =
                document.getElementById(
                    "loginPassword"
                ).value;


            status.textContent =
                "Logging in...";


            loginButton.disabled = true;



            /* ---------------------------------------------
               FIND EMAIL FROM USERNAME
            --------------------------------------------- */

            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .select("email")
                    .eq("username", username)
                    .maybeSingle();


            if (profileError) {

                console.error(
                    profileError
                );

                status.textContent =
                    profileError.message;

                loginButton.disabled = false;

                return;
            }


            if (!profile || !profile.email) {

                status.textContent =
                    "Username or password is incorrect.";

                loginButton.disabled = false;

                return;
            }



            /* ---------------------------------------------
               LOGIN THROUGH SUPABASE AUTH
            --------------------------------------------- */

            const {
                error: loginError
            } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email: profile.email,

                        password: password

                    });


            if (loginError) {

                console.error(
                    loginError
                );

                status.textContent =
                    "Username or password is incorrect.";

                loginButton.disabled = false;

                return;
            }



            /* ---------------------------------------------
               SUCCESS
            --------------------------------------------- */

            status.textContent =
                "Logged in successfully! :D";


            loginButton.disabled = false;



            /* ---------------------------------------------
               GO TO MAIN PAGE
            --------------------------------------------- */

            setTimeout(
                function() {

                    window.location.href =
                        "main.html";

                },
                700
            );

        }
    );



    /* =====================================================
       FORGOT PASSWORD
    ===================================================== */

    const forgotPassword =
        document.getElementById(
            "forgotPassword"
        );


    forgotPassword.addEventListener(
        "click",
        async function(event) {

            event.preventDefault();


            const status =
                document.getElementById(
                    "loginStatus"
                );


            const username =
                document.getElementById(
                    "loginUsername"
                ).value.trim();


            if (!username) {

                status.textContent =
                    "Enter your username first.";

                return;
            }


            status.textContent =
                "Finding account...";



            /* ---------------------------------------------
               FIND EMAIL
            --------------------------------------------- */

            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .select("email")
                    .eq("username", username)
                    .maybeSingle();


            if (profileError) {

                console.error(
                    profileError
                );

                status.textContent =
                    profileError.message;

                return;
            }


            if (!profile || !profile.email) {

                status.textContent =
                    "Username not found.";

                return;
            }



            /* ---------------------------------------------
               SEND RESET EMAIL
            --------------------------------------------- */

            const {
                error: resetError
            } =
                await supabaseClient.auth
                    .resetPasswordForEmail(
                        profile.email
                    );


            if (resetError) {

                console.error(
                    resetError
                );

                status.textContent =
                    resetError.message;

                return;
            }


            status.textContent =
                "Password reset email sent!";

        }
    );

</script>


</body>

</html>
