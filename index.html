<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BloxNG.Drive</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    to bottom,
                    #3c8dcc 0%,
                    #55a5d9 50%,
                    #78bde5 100%
                );

            color: white;
        }

        /* =========================================
           PAGE
        ========================================= */

        .page {
            min-height: 100vh;

            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding:
                clamp(25px, 5vw, 60px)
                20px
                30px;
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {
            display: block;

            width:
                clamp(
                    180px,
                    24vw,
                    330px
                );

            height: auto;

            margin-bottom:
                clamp(
                    20px,
                    3vw,
                    40px
                );
        }


        /* =========================================
           HEADLINE
        ========================================= */

        .headline {
            width: 100%;

            max-width: 1000px;

            text-align: center;

            font-size:
                clamp(
                    25px,
                    3vw,
                    42px
                );

            line-height: 1.15;

            font-weight: bold;

            margin-bottom:
                clamp(
                    25px,
                    4vw,
                    50px
                );

            text-shadow:
                0 2px 3px rgba(0, 0, 0, 0.18);
        }

        .headline span {
            display: block;
        }


        /* =========================================
           MAIN CONTENT
        ========================================= */

        .content {
            width: 100%;

            max-width: 1200px;

            display: flex;

            align-items: stretch;

            justify-content: center;

            gap:
                clamp(
                    20px,
                    4vw,
                    55px
                );
        }


        /* =========================================
           LEFT IMAGE
        ========================================= */

        .left {
            flex: 1;

            min-width: 0;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .main-image {
            display: block;

            width: 100%;

            height: auto;

            object-fit: contain;

            border-radius: 3px;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.2);
        }


        /* =========================================
           IMAGE PLACEHOLDER
        ========================================= */

        .image-placeholder {
            width: 100%;

            min-height: 300px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(255, 255, 255, 0.15);

            border:
                2px dashed
                rgba(255, 255, 255, 0.45);

            color:
                rgba(255, 255, 255, 0.8);

            font-size: 18px;

            border-radius: 3px;
        }


        /* =========================================
           FORM PANEL
        ========================================= */

        .form-panel {
            width:
                clamp(
                    320px,
                    36vw,
                    430px
                );

            flex-shrink: 0;

            background:
                rgba(15, 55, 95, 0.83);

            border-radius: 3px;

            box-shadow:
                0 6px 22px rgba(0, 0, 0, 0.2);

            overflow: hidden;
        }


        /* =========================================
           TABS
        ========================================= */

        .tabs {
            width: 100%;

            display: flex;

            background:
                rgba(5, 35, 65, 0.55);
        }

        .tab {
            flex: 1;

            border: none;

            background: transparent;

            color:
                rgba(255, 255, 255, 0.65);

            padding: 18px 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.15s ease,
                color 0.15s ease;
        }

        .tab:hover {
            color: white;

            background:
                rgba(255, 255, 255, 0.08);
        }

        .tab.active {
            color: white;

            background:
                rgba(255, 255, 255, 0.13);
        }


        /* =========================================
           FORM
        ========================================= */

        .form {
            padding:
                clamp(
                    25px,
                    3vw,
                    35px
                );
        }

        .form h2 {
            font-size: 26px;

            font-weight: normal;

            margin-bottom: 25px;
        }


        /* =========================================
           FORM FIELDS
        ========================================= */

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;

            font-size: 14px;

            margin-bottom: 7px;

            color:
                rgba(255, 255, 255, 0.9);
        }

        .field input,
        .field select {
            width: 100%;

            height: 43px;

            padding:
                0 12px;

            border:
                1px solid
                rgba(0, 0, 0, 0.25);

            border-radius: 3px;

            background: white;

            color: #333;

            font-size: 15px;

            outline: none;
        }

        .field input:focus,
        .field select:focus {
            border-color: #70b7e8;

            box-shadow:
                0 0 0 2px
                rgba(112, 183, 232, 0.25);
        }


        /* =========================================
           GREEN BUTTON
        ========================================= */

        .submit-button {
            width: 100%;

            height: 45px;

            margin-top: 8px;

            border: none;

            border-radius: 3px;

            background: #3da34a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                inset
                0 -2px 0
                rgba(0, 0, 0, 0.15);

            transition:
                background 0.15s ease,
                transform 0.05s ease;
        }

        .submit-button:hover {
            background: #48b856;
        }

        .submit-button:active {
            transform: translateY(1px);
        }


        /* =========================================
           FORGOT PASSWORD
        ========================================= */

        .forgot {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #a9d8ff;

            font-size: 14px;

            text-decoration: none;
        }

        .forgot:hover {
            color: white;

            text-decoration: underline;
        }


        /* =========================================
           LOGIN FORM
        ========================================= */

        #loginForm {
            display: none;
        }


        /* =========================================
           FOOTER
        ========================================= */

        footer {
            width: 100%;

            text-align: center;

            margin-top:
                clamp(
                    35px,
                    6vh,
                    70px
                );

            padding-bottom: 10px;

            font-size: 13px;

            color:
                rgba(255, 255, 255, 0.85);

            line-height: 2;
        }

        footer a {
            color: white;

            text-decoration: none;

            margin: 0 8px;
        }

        footer a:hover {
            text-decoration: underline;
        }


        /* =========================================
           TABLET / SMALL SCREEN
        ========================================= */

        @media (max-width: 850px) {

            .content {
                flex-direction: column;
            }

            .left {
                width: 100%;
            }

            .form-panel {
                width: 100%;

                max-width: 500px;

                margin: 0 auto;
            }
        }


        /* =========================================
           PHONE
        ========================================= */

        @media (max-width: 500px) {

            .page {
                padding-left: 12px;
                padding-right: 12px;
            }

            .headline {
                font-size: 25px;
            }

            .form {
                padding: 22px;
            }

            .tab {
                padding: 15px 8px;

                font-size: 14px;
            }

            .image-placeholder {
                min-height: 200px;
            }
        }
    </style>
</head>


<body>

    <div class="page">


        <!-- =====================================
             BloxNG.Drive LOGO
        ====================================== -->

        <img
            src="images/logo.png"
            class="logo"
            alt="BloxNG.Drive"
        >


        <!-- =====================================
             MAIN HEADING
        ====================================== -->

        <h1 class="headline">

            <span>
                Join the BloxNG.Drive community
            </span>

            <span>
                and explore what others have created
            </span>

        </h1>


        <!-- =====================================
             MAIN CONTENT
        ====================================== -->

        <div class="content">


            <!-- =================================
                 LEFT SIDE
            ================================== -->

            <div class="left">

                <!--
                    When you upload your image,
                    this will display it.

                    File location:

                    images/homepage.png
                -->

                <img
                    src="images/homepage.png"
                    class="main-image"
                    alt="BloxNG.Drive"
                >

            </div>


            <!-- =================================
                 RIGHT SIDE
            ================================== -->

            <div class="form-panel">


                <!-- =================================
                     TABS
                ================================== -->

                <div class="tabs">

                    <button
                        class="tab active"
                        id="signupTab"
                        onclick="showSignup()"
                    >
                        Sign Up
                    </button>


                    <button
                        class="tab"
                        id="loginTab"
                        onclick="showLogin()"
                    >
                        Login
                    </button>

                </div>


                <!-- =================================
                     SIGN UP
                ================================== -->

                <form
                    class="form"
                    id="signupForm"
                    onsubmit="return false;"
                >

                    <h2>
                        Create an account
                    </h2>


                    <!-- Birthday -->

                    <div class="field">

                        <label for="birthday">
                            Birthday
                        </label>

                        <input
                            type="date"
                            id="birthday"
                            name="birthday"
                        >

                    </div>


                    <!-- Gender -->

                    <div class="field">

                        <label for="gender">
                            Gender
                        </label>

                        <select
                            id="gender"
                            name="gender"
                        >

                            <option value="">
                                Select
                            </option>

                            <option value="male">
                                Male
                            </option>

                            <option value="female">
                                Female
                            </option>

                            <option value="other">
                                Other
                            </option>

                            <option value="prefer-not">
                                Prefer not to say
                            </option>

                        </select>

                    </div>


                    <!-- Username -->

                    <div class="field">

                        <label for="signupUsername">
                            Username
                        </label>

                        <input
                            type="text"
                            id="signupUsername"
                            name="username"
                            placeholder="Username"
                            autocomplete="username"
                        >

                    </div>


                    <!-- Password -->

                    <div class="field">

                        <label for="signupPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="signupPassword"
                            name="password"
                            placeholder="Password"
                            autocomplete="new-password"
                        >

                    </div>


                    <!-- Confirm Password -->

                    <div class="field">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm password"
                            autocomplete="new-password"
                        >

                    </div>


                    <!-- Sign Up Button -->

                    <button
                        type="submit"
                        class="submit-button"
                    >
                        Sign Up
                    </button>

                </form>


                <!-- =================================
                     LOGIN
                ================================== -->

                <form
                    class="form"
                    id="loginForm"
                    onsubmit="return false;"
                >

                    <h2>
                        Log in
                    </h2>


                    <!-- Username -->

                    <div class="field">

                        <label for="loginUsername">
                            Username
                        </label>

                        <input
                            type="text"
                            id="loginUsername"
                            name="username"
                            placeholder="Username"
                            autocomplete="username"
                        >

                    </div>


                    <!-- Password -->

                    <div class="field">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Password"
                            autocomplete="current-password"
                        >

                    </div>


                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="submit-button"
                    >
                        Login
                    </button>


                    <!-- Forgot Password -->

                    <a
                        href="#"
                        class="forgot"
                    >
                        Forgot your password?
                    </a>

                </form>

            </div>

        </div>


        <!-- =====================================
             FOOTER
        ====================================== -->

        <footer>

            <a href="#">
                About
            </a>

            <a href="#">
                Games
            </a>

            <a href="#">
                Forums
            </a>

            <a href="#">
                Help
            </a>

            <a href="#">
                Terms
            </a>

            <a href="#">
                Privacy
            </a>

            <br>

            © 2026 BloxNG.Drive

        </footer>

    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        function showSignup() {

            document.getElementById("signupForm").style.display = "block";

            document.getElementById("loginForm").style.display = "none";


            document
                .getElementById("signupTab")
                .classList
                .add("active");


            document
                .getElementById("loginTab")
                .classList
                .remove("active");
        }


        function showLogin() {

            document.getElementById("signupForm").style.display = "none";

            document.getElementById("loginForm").style.display = "block";


            document
                .getElementById("loginTab")
                .classList
                .add("active");


            document
                .getElementById("signupTab")
                .classList
                .remove("active");
        }

    </script>

</body>
</html>
