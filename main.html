<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BloxNG.Drive</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            font-family: Arial, Helvetica, sans-serif;

        }

        body {

            min-height: 100vh;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #2459a6 0%,
                    #326bb9 50%,
                    #3975c4 100%
                );

        }

        .page {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

        }

        header {

            height: 70px;

            display: flex;

            align-items: center;

            padding: 0 30px;

            background:
                rgba(20, 65, 125, 0.75);

            border-bottom:
                1px solid rgba(255,255,255,0.15);

        }

        header img {

            height: 48px;

            width: auto;

        }

        main {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

        }

        .placeholder {

            padding: 40px;

        }

        h1 {

            margin: 0 0 12px 0;

            font-size: 36px;

        }

        p {

            margin: 0;

            font-size: 18px;

            color: #c8def5;

        }

        footer {

            padding: 20px;

            text-align: center;

            color: #c8def5;

            font-size: 12px;

        }

    </style>

</head>


<body>

<div class="page">


    <header>

        <img
            src="logo.png"
            alt="BloxNG.Drive"
        >

    </header>


    <main>

        <div class="placeholder">

            <h1>
                Welcome to BloxNG.Drive! :D
            </h1>

            <p>
                Your main page is coming soon...
            </p>

        </div>

    </main>


    <footer>

        © 2026 BloxNG.Drive

    </footer>


</div>

</body>

</html>
